# Configuration file
# Empyrean Engines: only the settings the pack changes are listed here. Apotheosis adds the rest
# (with their defaults) the first time it loads.

world_tiers {
    # Off: Silent Apotheosis Raids sets every player's world tier automatically, from their own play time
    # and milestones (Frontier 5 h; Ascent 15 h + the Nether; Summit 30 h + the Wither; Pinnacle 60 h + the End).
    B:"Enable Manual World Tier Changes"=false
}

