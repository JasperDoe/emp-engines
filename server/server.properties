motd=Empyrean Engines
max-players=20
white-list=true
enforce-whitelist=true
online-mode=true
difficulty=normal
# Airships trip the vanilla "flying is not enabled" kick without this
allow-flight=true
spawn-protection=0
# Lowered from 10/8: the tick loop is single-threaded, so heavy worldgen at a
# wide radius stalls it and remote players rubber-band. 8/6 cuts the per-tick
# chunk and entity load sharply. Raise again once the world is pre-generated.
view-distance=8
simulation-distance=6
enable-command-block=true
# Heavy Create factories can stall a tick; don't let the watchdog kill the server
max-tick-time=180000
sync-chunk-writes=false
level-name=world
